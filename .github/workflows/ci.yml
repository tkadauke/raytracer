name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-24.04
            compiler: clang-18
            cc: clang-18
            cxx: clang++-18
          - os: macos-14
            compiler: apple-clang
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.cxx }} \
            ninja-build \
            cmake \
            qtbase5-dev \
            qtbase5-dev-tools \
            qtscript5-dev \
            libqt5gui5 \
            libqt5widgets5 \
            xvfb

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja qt@5

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Test
        if: runner.os == 'macOS'
        run: ctest --preset release

      - name: Test (Linux, headless)
        if: runner.os == 'Linux'
        run: |
          # Several widget tests construct QWidgets; run under Xvfb so
          # QApplication can connect to a virtual display.
          xvfb-run --auto-servernum ctest --preset release

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CC: clang-18
      CXX: clang++-18
      # detect_leaks=1 is Linux/x86 only; CI runs on Linux so we get LSan too.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            ninja-build \
            cmake \
            qtbase5-dev \
            qtbase5-dev-tools \
            qtscript5-dev \
            libqt5gui5 \
            libqt5widgets5 \
            xvfb

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan --parallel

      - name: Test
        run: xvfb-run --auto-servernum ctest --preset asan

  fuzz:
    name: Fuzz PLY parser
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CC: clang-18
      CXX: clang++-18

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            ninja-build \
            cmake \
            qtbase5-dev \
            qtbase5-dev-tools \
            qtscript5-dev

      - name: Configure
        run: cmake --preset fuzz

      - name: Build
        run: cmake --build --preset fuzz --target fuzz_ply --parallel

      - name: Smoke-fuzz (60s)
        # 60-second budget on every push — enough to catch obvious crashes
        # without ballooning CI time. Longer-running runs belong in a
        # scheduled workflow once OSS-Fuzz integration is set up.
        run: |
          mkdir -p fuzz/findings
          ./build/fuzz/fuzz/fuzz_ply \
            -max_total_time=60 \
            -timeout=10 \
            -print_final_stats=1 \
            -artifact_prefix=fuzz/findings/ \
            fuzz/corpus/ply

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz/findings/

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The existing code base predates these tools — there are ~5000 format
    # diffs and a large clang-tidy backlog. Treat both as advisory until a
    # bulk reformat lands; report results to the job summary so reviewers
    # can see the trend without blocking PRs.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format-18 \
            clang-tidy-18 \
            clang-18 \
            cmake \
            ninja-build \
            qtbase5-dev \
            qtbase5-dev-tools \
            qtscript5-dev
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy   clang-tidy   /usr/bin/clang-tidy-18 100

      - name: clang-format --dry-run
        run: |
          set +e
          violations=$(find include src test examples tools benchmarks fuzz \
              -name '*.h' -o -name '*.cpp' \
              | xargs clang-format --dry-run 2>&1 \
              | grep -c 'code should be clang-formatted' || true)
          echo "clang-format violations: $violations" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$violations" -eq 0 ]

      - name: Configure for clang-tidy
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset release

      - name: clang-tidy
        run: |
          set +e
          # Lint our own translation units only — skip generated autogen
          # sources (mocs_compilation.cpp, ui_*.h) and the FetchContent
          # GoogleTest tree.
          files=$(find include src test examples tools benchmarks fuzz \
              -name '*.cpp' \
              | head -200)
          run-clang-tidy-18 -p build/release -quiet -j 4 $files \
              > clang-tidy.log 2>&1
          status=$?
          echo "## clang-tidy summary" >> "$GITHUB_STEP_SUMMARY"
          warnings=$(grep -c 'warning:' clang-tidy.log || true)
          errors=$(grep -c 'error:' clang-tidy.log || true)
          echo "* warnings: $warnings" >> "$GITHUB_STEP_SUMMARY"
          echo "* errors:   $errors"   >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload clang-tidy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: clang-tidy.log

  docker:
    name: Build container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build image
        # Builds the rendercli runtime image but does not push — the publish
        # step belongs in a release workflow with proper OIDC + cosign once
        # we cut tagged releases (modernize.md §3.8 / §3.9).
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: raytracer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test rendercli --help
        # Distroless has no shell, so we exec rendercli directly. Exit non-zero
        # is acceptable — we only care that the binary loads (its Qt deps
        # resolve, the entrypoint runs).
        run: docker run --rm raytracer:ci --help || true
