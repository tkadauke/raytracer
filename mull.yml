# mull (mutation testing) configuration — closes #28.
#
# Scope: math primitives only. The high-leverage targets for mutation testing
# are the numerical kernels, where a missed sign flip or off-by-one survives
# pure line-coverage checks (see the Quartic::solve fix in commit 260a7a3 for
# a concrete example). Everything else — Qt widgets, scene wrappers, JSON
# parsers — has either better natural test coverage or low value-per-mutant.
#
# Mutation operators: arithmetic, relational, boundary. These map cleanly
# onto the failure modes the math primitives have actually exhibited.
#
# Run via the mutation.yml GitHub Actions workflow; on a dev machine:
#   cmake --preset mutation -DMULL_PLUGIN=$(brew --prefix mull)/lib/mull-ir-frontend.dylib
#   cmake --build --preset mutation --parallel
#   mull-runner ./build/mutation/test/unit/unit_tests \
#     --report-dir mutation-report --report-name math --report-patch-only

includePaths:
  - ^include/core/math/
  - ^src/core/math/

excludePaths:
  # Generated by AUTOMOC / AUTOUIC; not source code.
  - mocs_compilation\.cpp$
  - moc_.+\.cpp$
  - ui_.+\.h$
  # SSE3 specialisations bring tons of fragile mutants on intrinsics that
  # the existing benchmark suite catches more directly. Re-enable once
  # docs/modernize.md §3.4 grows the benchmark coverage.
  - include/core/math/vector/sse3/
  - include/core/color/sse3/

mutators:
  - cxx_arithmetic
  - cxx_comparison
  - cxx_boundary

timeout: 30000  # ms per mutant — math kernels are fast; bail on infinite loops
