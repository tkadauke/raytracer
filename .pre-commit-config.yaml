# pre-commit hooks (modernize.md §3.10).
#
# Install once with:
#
#   pip install pre-commit                 # or `brew install pre-commit`
#   pre-commit install
#
# After that, the hooks below run automatically before every commit.
# Run them manually across the whole tree with:
#
#   pre-commit run --all-files
#
# clang-format runs in normal fix mode. The repository has a committed
# clang-format baseline, so per-commit formatting should only touch files being
# changed in that commit.

minimum_pre_commit_version: '3.5.0'

exclude: '^(build|build-.*|docs/(html|images|latex))/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.4
    hooks:
      - id: clang-format
        types_or: [c++, c]
