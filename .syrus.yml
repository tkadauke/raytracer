# Syrus-native CI for raytracer.
#
# Runs inside Syrus's worker pod (Linux x86_64, K3s on an Intel NUC i7
# gen 12) on every implement -> grade iteration. The iteration loop can
# run up to 5 times per agent workflow, so each grader's cost is paid up
# to 5x — speed is the primary design constraint here.
#
# Design choices:
#   - No `prepare:` block. The worker pod's image
#     (ghcr.io/tkadauke/syrus-worker-dev) bakes in cmake, ninja, Qt 6,
#     xvfb, build-essential (g++-12), and Ruby + rake via mise. The
#     worker runs as uid 1000 with no sudo capability, so per-iteration
#     apt-get is not an option even if it were fast.
#   - The release build/test path stays combined so the agent gets one
#     signal covering both compile and correctness regressions. Benchmark
#     sources get their own compile-only gate because they are off by
#     default in release builds and can otherwise rot unnoticed.
#     Per-iteration incremental rebuilds are cheap because the workspace
#     persists across iterations.
#   - Only fast, broad-coverage gates live in the loop. Sanitize, fuzz,
#     coverage, and lint are not run here — they would multiply the
#     agent's wall time with no per-iteration value. When Syrus grows a
#     post-grade primitive that runs once per workflow rather than per
#     iteration, the slow gates move here.

adversarial_review:
  rounds: 1

grade:
  max_iterations: 5
  steps:
    - name: build-test
      # cmake configure is idempotent; ninja incremental rebuild on
      # iterations 2-5 is seconds, not minutes. QT_QPA_PLATFORM=offscreen
      # lets widget tests that construct a QApplication run without a real
      # display server (xvfb requires xauth, which is absent in the worker
      # image). Default compiler is g++-12 from build-essential —
      # CMakePresets.json's release preset doesn't pin a compiler.
      # LIBGL_ALWAYS_SOFTWARE=1 forces Mesa's software rasterizer for any
      # OpenGL-touching tests; without it the worker's headless GL stack
      # would fall back to swrast probing, which is slower and noisier.
      run: |
        cmake --preset release && \
        cmake --build --preset release --parallel && \
        QT_QPA_PLATFORM=offscreen LIBGL_ALWAYS_SOFTWARE=1 \
          ctest --preset release --parallel $(nproc) --output-on-failure
      # A cold worker build (empty workspace, no ccache) compiles the whole
      # templated + Qt tree from scratch and can run well past 20 minutes
      # while still making steady progress. Give it headroom so a slow-but-
      # healthy cold build isn't killed mid-compile; warm incremental rebuilds
      # on later iterations still finish in seconds.
      timeout_minutes: 45

    - name: coverage
      # Measures line coverage with gcovr and enforces a 60% floor.
      # The floor matches COVERAGE_LINE_FLOOR in
      # docs/plans/github_actions/ci.yml and should only ever increase.
      # gcovr is installed via pip3 --user if absent from the worker image.
      # The coverage build (build/coverage/) is independent of the release
      # build (build/release/) so no incremental-build state is shared.
      # Placed after build-test so a fast correctness failure skips the
      # slower instrumented build.
      run: |
        python3 -m pip install --target /tmp/gcovr-pkg --quiet gcovr || true
        cmake --preset coverage && \
        cmake --build --preset coverage --parallel && \
        QT_QPA_PLATFORM=offscreen LIBGL_ALWAYS_SOFTWARE=1 \
          ctest --test-dir build/coverage --output-on-failure && \
        PYTHONPATH=/tmp/gcovr-pkg python3 -m gcovr --root . \
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
          --filter '^include/' \
          --filter '^src/' \
          --exclude '.*Test\.cpp' \
          --exclude '.*\.moc' \
          --exclude 'build/.*' \
          --txt -o coverage.txt \
          --print-summary | tee coverage-summary.txt && \
        line_pct=$(grep -oE 'lines: *[0-9.]+%' coverage-summary.txt \
          | grep -oE '[0-9.]+' | head -1) && \
        echo "Coverage: ${line_pct}% (floor: 60%)" && \
        awk -v p="$line_pct" 'BEGIN { exit (p+0 < 60) }'
      # Cold coverage builds compile ~670 TUs with gcov instrumentation at
      # -O1. Observed cold-build time on the CI pod: library (~390 TUs)
      # alone consumes ~60 min; the full build including tests runs ~100 min.
      # 120 min gives a 20 % buffer for cold starts; warm incremental rebuilds
      # on later iterations still finish in minutes.
      timeout_minutes: 120

    - name: opengl-egl
      # Dedicated lane for the OpenGL-touching unit tests so we get
      # explicit visibility into whether the GL pipeline is exercised
      # in CI — without this, `build-test` runs the same tests but they
      # silently `GTEST_SKIP` when no GL context is available.
      #
      # `unit_tests` has no `QGuiApplication`, so on Linux the
      # `engine::raster::gl::createOffscreenContext()` factory picks
      # `EglContext` (Mesa surfaceless EGL). `LIBGL_ALWAYS_SOFTWARE=1`
      # forces software rasterization so results stay deterministic
      # across worker generations.
      #
      # Fails the step (non-zero exit) if zero tests pass, which
      # signals the worker image is missing Mesa's `libgl1-mesa-dri`
      # runtime or `libegl-mesa0` and the GL lane is silently no-op.
      run: |
        cmake --build --preset release --target unit_tests --parallel && \
        log=build/release/opengl-egl.log && \
        QT_QPA_PLATFORM=offscreen LIBGL_ALWAYS_SOFTWARE=1 \
          build/release/test/unit/unit_tests \
            --gtest_filter='OpenGL*:*Egl*:*Cgl*:*GlAvailability*:*AttachmentSet*:*Parity*' \
            2>&1 | tee "$log" && \
        # gtest prints `[  PASSED  ] N tests.` exactly once at the end;
        # if N is 0 the lane is silently no-op (Mesa runtime missing).
        passed=$(sed -nE 's/^\[  PASSED  \] ([0-9]+) tests?\..*/\1/p' "$log" | tail -1) && \
        if [ -z "$passed" ] || [ "$passed" -lt 1 ]; then \
          echo "ERROR: opengl-egl lane ran but zero tests passed — Mesa runtime missing?"; \
          exit 1; \
        fi && \
        echo "opengl-egl lane: $passed tests passed through EGL surfaceless"
      timeout_minutes: 10

    - name: benchmark-build
      # Compile-only benchmark gate. Full benchmark timing runs are too
      # slow and noisy for the implement -> grade loop, but building the
      # benchmark preset catches compile/link errors in sources that are
      # not part of the default release build. The list-tests smoke keeps
      # registration/main wiring honest without measuring performance.
      run: |
        cmake --preset benchmark && \
        cmake --build --preset benchmark --target benchmarks --parallel && \
        ./build/benchmark/benchmarks/benchmarks --benchmark_list_tests=true >/dev/null
      timeout_minutes: 10

    - name: textbook
      # Markdown drift check + freshness of the generated source-map
      # appendix. Pure Ruby + git; finishes in under 5 seconds.
      run: |
        rake docs:textbook:check && \
        rake docs:textbook:source-map && \
        git diff --exit-code -- docs/markdown/appendix/c-source-map.md
      timeout_minutes: 3
