name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-24.04
            compiler: clang-18
            cc: clang-18
            cxx: clang++-18
          - os: macos-14
            compiler: apple-clang
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.cxx }} \
            ninja-build \
            cmake \
            qt6-base-dev \
            qt6-declarative-dev \
            libgl1-mesa-dev \
            xvfb

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja qt

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Test
        if: runner.os == 'macOS'
        run: ctest --preset release

      - name: Test (Linux, headless)
        if: runner.os == 'Linux'
        run: |
          # Several widget tests construct QWidgets; run under Xvfb so
          # QApplication can connect to a virtual display.
          xvfb-run --auto-servernum ctest --preset release

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CC: clang-18
      CXX: clang++-18
      # detect_leaks=1 is Linux/x86 only; CI runs on Linux so we get LSan too.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            ninja-build \
            cmake \
            qt6-base-dev \
            qt6-declarative-dev \
            libgl1-mesa-dev \
            xvfb

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan --parallel

      - name: Test
        run: xvfb-run --auto-servernum ctest --preset asan

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # Ratchet: line coverage may not drop below this. Modernize.md §3.4
      # targets 80%; the current floor reflects the post-CMake-migration
      # measurement on master and should only ever go up.
      COVERAGE_LINE_FLOOR: '60'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-13 \
            ninja-build \
            cmake \
            gcovr \
            qt6-base-dev \
            qt6-declarative-dev \
            libgl1-mesa-dev \
            xvfb

      - name: Configure
        run: cmake --preset coverage
        env:
          CC: gcc-13
          CXX: g++-13

      - name: Build
        run: cmake --build --preset coverage --parallel

      - name: Test
        run: xvfb-run --auto-servernum ctest --test-dir build/coverage --output-on-failure

      - name: Run gcovr
        # Filter to our own code; skip tests, generated AUTOMOC sources, and
        # the FetchContent GoogleTest tree.
        run: |
          gcovr --root . \
            --filter '^include/' \
            --filter '^src/' \
            --exclude '.*Test\.cpp' \
            --exclude '.*\.moc' \
            --exclude 'build/.*' \
            --xml-pretty -o coverage.xml \
            --txt -o coverage.txt \
            --html-details coverage.html \
            --print-summary | tee coverage-summary.txt

      - name: Enforce coverage floor
        run: |
          line_pct=$(grep -oE 'lines: *[0-9.]+%' coverage-summary.txt | grep -oE '[0-9.]+' | head -1)
          floor=${COVERAGE_LINE_FLOOR}
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "* line:     $line_pct%" >> "$GITHUB_STEP_SUMMARY"
          echo "* floor:    $floor%" >> "$GITHUB_STEP_SUMMARY"
          awk -v p="$line_pct" -v f="$floor" 'BEGIN { exit (p+0 < f+0) }'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage*

  fuzz:
    name: Fuzz PLY parser
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CC: clang-18
      CXX: clang++-18

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            ninja-build \
            cmake \
            qt6-base-dev \
            qt6-declarative-dev

      - name: Configure
        run: cmake --preset fuzz

      - name: Build
        run: cmake --build --preset fuzz --target fuzz_ply --parallel

      - name: Smoke-fuzz (60s)
        # 60-second budget on every push — enough to catch obvious crashes
        # without ballooning CI time. Longer-running runs belong in a
        # scheduled workflow once OSS-Fuzz integration is set up.
        run: |
          mkdir -p fuzz/findings
          ./build/fuzz/fuzz/fuzz_ply \
            -max_total_time=60 \
            -timeout=10 \
            -print_final_stats=1 \
            -artifact_prefix=fuzz/findings/ \
            fuzz/corpus/ply

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: fuzz/findings/

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The existing code base predates these tools — there are ~5000 format
    # diffs and a large clang-tidy backlog. Treat both as advisory until a
    # bulk reformat lands; report results to the job summary so reviewers
    # can see the trend without blocking PRs.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format-18 \
            clang-tidy-18 \
            clang-18 \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-declarative-dev
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy   clang-tidy   /usr/bin/clang-tidy-18 100

      - name: clang-format --dry-run
        run: |
          set +e
          violations=$(find include src test tools benchmarks fuzz \
              -name '*.h' -o -name '*.cpp' \
              | xargs clang-format --dry-run 2>&1 \
              | grep -c 'code should be clang-formatted' || true)
          echo "clang-format violations: $violations" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$violations" -eq 0 ]

      - name: Configure for clang-tidy
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset release

      - name: clang-tidy
        run: |
          set +e
          # Lint our own translation units only — skip generated autogen
          # sources (mocs_compilation.cpp, ui_*.h) and the FetchContent
          # GoogleTest tree.
          files=$(find include src test tools benchmarks fuzz \
              -name '*.cpp' \
              | head -200)
          run-clang-tidy-18 -p build/release -quiet -j 4 $files \
              > clang-tidy.log 2>&1
          status=$?
          echo "## clang-tidy summary" >> "$GITHUB_STEP_SUMMARY"
          warnings=$(grep -c 'warning:' clang-tidy.log || true)
          errors=$(grep -c 'error:' clang-tidy.log || true)
          echo "* warnings: $warnings" >> "$GITHUB_STEP_SUMMARY"
          echo "* errors:   $errors"   >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload clang-tidy log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-log
          path: clang-tidy.log

  docker:
    name: Build container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build image
        # Builds the rendercli runtime image but does not push — the publish
        # step belongs in a release workflow with proper OIDC + cosign once
        # we cut tagged releases (modernize.md §3.8 / §3.9).
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          push: false
          load: true
          tags: raytracer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test rendercli --help
        # Distroless has no shell, so we exec rendercli directly. Exit non-zero
        # is acceptable — we only care that the binary loads (its Qt deps
        # resolve, the entrypoint runs).
        run: docker run --rm raytracer:ci --help || true

  sbom:
    name: SBOM (per-commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Generate SBOM (SPDX JSON)
        # Per-commit dependency snapshot — gives reviewers a sense of the
        # dependency surface without waiting for a tagged release. The
        # release workflow (release.yml) is what attaches the signed SBOM
        # to the GitHub release; this job just uploads the artifact.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: raytracer-sbom-${{ github.sha }}.spdx.json

  textbook:
    name: Textbook (markdown drift)
    # Validates docs/markdown/ links, source-anchor blocks, and widget
    # references; verifies the generated source-map appendix is fresh.
    # Lightweight: Ruby + git only, no C++ build.
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: rake docs:textbook:check
        run: rake docs:textbook:check

      - name: rake docs:textbook:source-map (fail if committed file is stale)
        run: |
          rake docs:textbook:source-map
          if ! git diff --quiet -- docs/markdown/appendix/c-source-map.md; then
            echo "::error::docs/markdown/appendix/c-source-map.md is stale; run \`rake docs:textbook:source-map\` and commit the result."
            git --no-pager diff -- docs/markdown/appendix/c-source-map.md
            exit 1
          fi
