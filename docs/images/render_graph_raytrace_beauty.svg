<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Raytraced beauty render graph</title>
  <desc id="desc">A render graph with one raytraced beauty pass writing the main color resource.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="758" height="258" rx="8" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="48" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#202020">compiled render plan</text>
  <text x="48" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#555555">The first graph-backed render is a single beauty pass that produces the exported color image.</text>

  <ellipse cx="232" cy="148" rx="142" ry="54" fill="#e8f1fb" stroke="#2276d2" stroke-width="3" filter="url(#shadow)"/>
  <text x="232" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#202020">Raytraced beauty</text>
  <text x="232" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" text-anchor="middle" fill="#3f5f82">beauty / raytracer</text>

  <line x1="377" y1="148" x2="510" y2="148" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="444" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle" fill="#555555">writes</text>

  <rect x="530" y="106" width="164" height="84" rx="4" fill="#edf7ef" stroke="#2c8b45" stroke-width="3" filter="url(#shadow)"/>
  <text x="612" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#202020">main_color</text>
  <text x="612" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" text-anchor="middle" fill="#3e6c48">color resource</text>
</svg>
